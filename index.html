<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Elite - Dashboard</title>
    <!-- 1. Estilos Base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 2. Librerías (Orden Crítico para evitar errores de Recharts) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc;
            margin: 0;
            color: #334155;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #ffffff; z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #f1f5f9;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-slate-400 text-sm font-medium">Iniciando App...</p>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, XAxis, YAxis, Tooltip, Legend, BarChart, Bar, CartesianGrid, LabelList } = Recharts;

        // FUNCIÓN DE FORMATO GLOBAL (Fuera del componente para evitar ReferenceError)
        const fmt = (val) => {
            const n = parseFloat(val) || 0;
            return n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
        };

        const Icons = {
            Wallet: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
            Piggy: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1 .5-1.5 1-2V5Z"/><path d="M12 2v4"/></svg>,
            Loans: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m11 15-3-3 3-3"/><path d="m15 9 3 3-3 3"/><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M12 5v14"/></svg>,
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Cloud: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.5 19c2.5 0 4.5-2 4.5-4.5 0-2-1.3-3.7-3.1-4.2C18.4 6.2 14.8 3 10.5 3 6.7 3 3.5 5.5 2.4 9 1 9.9 0 11.5 0 13.3c0 2 1.6 3.7 3.6 3.7h13.9Z"/></svg>,
            Settings: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const TAGS = ['Belleza', 'Salidas', 'Efectivo', 'Compras', 'Uber', 'Comida'];
        const COLORS = ['#6366f1', '#db2777', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6'];

        const App = () => {
            const [activeTab, setActiveTab] = useState('Enero');
            const [isMobileMode, setIsMobileMode] = useState(false);
            const [showMonthSelector, setShowMonthSelector] = useState(false);
            const [scriptUrl, setScriptUrl] = useState(localStorage.getItem('finance_url') || '');
            const [syncStatus, setSyncStatus] = useState('idle');

            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('finance_data');
                    if (saved) return JSON.parse(saved);
                } catch (e) { console.error("Error al cargar caché local", e); }
                
                return {
                    config: { pNec: 50, pDes: 30, pAho: 20 },
                    loans: [],
                    monthly: MONTHS.reduce((acc, month) => {
                        acc[month] = { salario: 0, entradas: 0, mesPasado: 0, prestado: 0, ahorroManual: 0, gastosFijos: [], gastosVariables: [] };
                        return acc;
                    }, {})
                };
            });

            // Limpiar el loader forzadamente al montar
            useEffect(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('finance_data', JSON.stringify(data));
            }, [data]);

            // Handlers
            const updateMonth = (m, f, v) => setData(p => ({...p, monthly: {...p.monthly, [m]: {...p.monthly[m], [f]: parseFloat(v) || 0}}}));
            const updateConfig = (f, v) => setData(p => ({...p, config: {...p.config, [f]: parseInt(v) || 0}}));
            const addLoan = (n, m) => setData(p => ({...p, loans: [{id:Date.now(),nombre:n,monto:parseFloat(m),pagado:false,fecha:new Date().toLocaleDateString()}, ...p.loans]}));
            const toggleLoan = (id) => setData(p => ({...p, loans: p.loans.map(l => l.id === id ? {...l, pagado: !l.pagado} : l)}));
            const deleteLoan = (id) => setData(p => ({...p, loans: p.loans.filter(l => l.id !== id)}));
            const addGasto = (m, t) => setData(p => ({...p, monthly: {...p.monthly, [m]: {...p.monthly[m], [t]: [...p.monthly[m][t], {id:Date.now(),nombre:'',valor:0,tag:TAGS[0]}]}}}));
            const updateGasto = (m, t, id, f, v) => setData(p => ({...p, monthly: {...p.monthly, [m]: {...p.monthly[m], [t]: p.monthly[m][t].map(i => i.id === id ? {...i, [f]: f==='valor'?parseFloat(v)||0:v} : i)}}}));
            const deleteGasto = (m, t, id) => setData(p => ({...p, monthly: {...p.monthly, [m]: {...p.monthly[m], [t]: p.monthly[m][t].filter(i => i.id !== id)}}}));

            // Lógica
            const cur = data.monthly[activeTab] || {};
            const ing = (cur.salario || 0) + (cur.entradas || 0) + (cur.mesPasado || 0) + (cur.prestado || 0);
            const base = Math.max(0, ing - (cur.ahorroManual || 0));
            const vNec = base * (data.config.pNec / 100);
            const vDes = base * (data.config.pDes / 100);
            const vAho = base * (data.config.pAho / 100);
            const gFij = cur.gastosFijos?.reduce((s, g) => s + (parseFloat(g.valor) || 0), 0) || 0;
            const gVar = cur.gastosVariables?.reduce((s, g) => s + (parseFloat(g.valor) || 0), 0) || 0;
            const disp = (vNec + vDes) - (gFij + gVar);

            const savings = MONTHS.map(m => {
                const d = data.monthly[m];
                const i = (d.salario || 0) + (d.entradas || 0) + (d.mesPasado || 0) + (d.prestado || 0);
                const b = Math.max(0, i - (d.ahorroManual || 0));
                const fij = d.gastosFijos?.reduce((s, g) => s + (parseFloat(g.valor) || 0), 0) || 0;
                const var_ = d.gastosVariables?.reduce((s, g) => s + (parseFloat(g.valor) || 0), 0) || 0;
                const rem = Math.max(0, (b * ((data.config.pNec + data.config.pDes) / 100)) - (fij + var_));
                return { month: m, total: (d.ahorroManual || 0) + (b * (data.config.pAho / 100)) + rem };
            });

            return (
                <div className={`flex h-screen transition-all ${isMobileMode ? 'justify-center items-center p-2 bg-slate-200' : ''}`}>
                    <button onClick={() => { setIsMobileMode(!isMobileMode); setShowMonthSelector(false); }} className="fixed bottom-6 right-6 z-[100] bg-indigo-600 text-white p-3 rounded-2xl shadow-xl hover:bg-indigo-700 transition-all flex items-center gap-2">
                        <Icons.Wallet />
                        <span className="text-[10px] font-bold uppercase tracking-widest hidden md:block">{isMobileMode ? 'Escritorio' : 'Móvil'}</span>
                    </button>

                    {!isMobileMode && (
                        <aside className="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-sm">
                            <div className="p-8 border-b border-slate-50 flex items-center gap-3">
                                <div className="bg-indigo-600 p-1.5 rounded-lg text-white shadow-md shadow-indigo-100"><Icons.Wallet /></div>
                                <h1 className="font-bold text-lg text-slate-800 italic tracking-tighter">FinanceApp</h1>
                            </div>
                            <nav className="flex-1 overflow-y-auto p-4 space-y-1 custom-scrollbar">
                                <button onClick={() => setActiveTab('Ahorros')} className={`w-full text-left px-4 py-3 rounded-xl transition-all font-semibold ${activeTab==='Ahorros'?'bg-indigo-50 text-indigo-700':'text-slate-500 hover:bg-slate-50'}`}>Bóveda</button>
                                <button onClick={() => setActiveTab('Préstamos')} className={`w-full text-left px-4 py-3 rounded-xl transition-all font-semibold ${activeTab==='Préstamos'?'bg-indigo-50 text-indigo-700':'text-slate-500 hover:bg-slate-50'}`}>Deudas</button>
                                <div className="p-4 text-[9px] font-bold text-slate-300 uppercase tracking-widest border-t border-slate-50 mt-4">Meses</div>
                                {MONTHS.map(m => (
                                    <button key={m} onClick={() => setActiveTab(m)} className={`w-full text-left px-4 py-2 rounded-lg transition-all text-xs ${activeTab===m?'bg-slate-800 text-white shadow-md':'text-slate-400 hover:bg-slate-50'}`}>{m}</button>
                                ))}
                            </nav>
                        </aside>
                    )}

                    <div className={`flex-1 flex flex-col transition-all duration-500 ${isMobileMode ? 'max-w-[400px] max-h-[820px] w-full h-full bg-white rounded-3xl border-[12px] border-slate-900 shadow-2xl overflow-hidden relative' : 'overflow-hidden'}`}>
                        {isMobileMode && (
                            <header className="bg-white px-6 pt-10 pb-4 border-b border-slate-100 flex justify-between items-center sticky top-0 z-50">
                                <h2 className="font-bold text-slate-800 uppercase text-xs tracking-widest italic">{activeTab}</h2>
                                <div className="w-2 h-2 rounded-full bg-indigo-100" />
                            </header>
                        )}

                        <main className={`flex-1 overflow-y-auto custom-scrollbar ${isMobileMode ? 'p-5 pb-32' : 'p-10 lg:p-16'}`}>
                            {activeTab === 'Ahorros' && (
                                <div className="space-y-8 fade-in">
                                    <div className="bg-indigo-600 p-8 rounded-2xl text-white shadow-xl">
                                        <span className="text-[10px] font-bold uppercase opacity-60">Capital Acumulado Anual</span>
                                        <h2 className="text-4xl font-bold mt-1 tracking-tighter">{fmt(savings.reduce((s, a) => s + a.total, 0))}</h2>
                                    </div>
                                    <div className="bg-white border border-slate-100 rounded-xl overflow-hidden shadow-sm">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-50 text-slate-400 font-bold uppercase text-[9px]">
                                                <tr><th className="p-4">Mes</th><th className="p-4 text-right">Ahorro</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {savings.map(s => <tr key={s.month} className="hover:bg-slate-50"><td className="p-4 font-semibold text-slate-600">{s.month}</td><td className="p-4 text-right font-bold text-emerald-600">{fmt(s.total)}</td></tr>)}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'Préstamos' && (
                                <div className="space-y-8 fade-in">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 className="text-sm font-bold text-slate-800">Registrar Deuda</h3>
                                        <form onSubmit={e => {e.preventDefault(); addLoan(e.target.n.value, e.target.m.value); e.target.reset();}} className="flex gap-2">
                                            <input name="n" placeholder="Nombre" className="flex-1 text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none" required />
                                            <input name="m" type="number" step="0.01" placeholder="Monto" className="w-24 text-xs p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none" required />
                                            <button className="bg-indigo-600 text-white px-4 rounded-lg text-[10px] font-bold">OK</button>
                                        </form>
                                    </div>
                                    <div className="space-y-2">
                                        {data.loans.map(l => (
                                            <div key={l.id} className={`flex items-center justify-between p-4 rounded-xl border ${l.pagado?'opacity-50 bg-slate-50':'bg-white shadow-sm'}`}>
                                                <div className="flex items-center gap-3">
                                                    <button onClick={() => toggleLoan(l.id)} className={`w-8 h-8 rounded-lg flex items-center justify-center ${l.pagado?'bg-emerald-100 text-emerald-600':'bg-amber-50 text-amber-600'}`}>{l.pagado?'✓':'⏰'}</button>
                                                    <div><p className={`text-xs font-semibold ${l.pagado?'line-through text-slate-400':''}`}>{l.nombre}</p><p className="text-[8px] text-slate-400 font-bold uppercase">{l.fecha}</p></div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className="text-xs font-bold text-slate-900">{fmt(l.monto)}</span>
                                                    <button onClick={() => deleteLoan(l.id)} className="text-slate-300 hover:text-rose-500"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {MONTHS.includes(activeTab) && (
                                <div className="space-y-10 fade-in">
                                    <header className="flex justify-between items-end border-b border-slate-100 pb-8">
                                        <h2 className="text-4xl font-light text-slate-800 tracking-tighter">{activeTab}</h2>
                                        <div className="text-right">
                                            <span className="text-[9px] font-bold text-slate-300 uppercase tracking-widest">Disponible Real</span>
                                            <div className={`text-2xl font-bold ${disp<0?'text-rose-500':'text-indigo-600'}`}>{fmt(disp)}</div>
                                        </div>
                                    </header>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {[{l:'Sueldo',k:'salario'},{l:'Extras',k:'entradas'},{l:'Pasado',k:'mesPasado'},{l:'Préstamo',k:'prestado'}].map(i => (
                                            <div key={i.k} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                                                <label className="text-[9px] font-bold text-slate-400 uppercase mb-2 block">{i.l}</label>
                                                <div className="flex items-center gap-1 font-bold text-slate-800">
                                                    <span className="text-slate-300 text-xs">€</span>
                                                    <input type="number" className="bg-transparent border-none w-full p-0 outline-none text-sm" value={cur[i.k] || ''} onChange={e=>updateMonth(activeTab,i.k,e.target.value)} />
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="bg-slate-900 p-8 rounded-2xl text-white flex justify-between items-center shadow-xl">
                                        <div><h4 className="font-bold text-base tracking-tight">Ahorro Manual</h4><p className="text-indigo-200 text-[10px] opacity-40">Bloqueado prioritariamente.</p></div>
                                        <div className="flex items-center gap-3 border-b border-white/20 pb-2">
                                            <span className="text-indigo-400 font-bold text-xl">€</span>
                                            <input type="number" className="bg-transparent border-none p-0 text-2xl font-bold text-white outline-none w-24 text-center" placeholder="0" value={cur.ahorroManual || ''} onChange={(e)=>updateMonth(activeTab,'ahorroManual',e.target.value)} />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 space-y-8 bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                                            <div className="flex justify-between items-center font-bold text-[10px] text-slate-400 uppercase tracking-widest">
                                                Reparto Regla % {!isConfigValid && <span className="text-rose-500 animate-pulse underline italic">Suma incorrecta</span>}
                                            </div>
                                            <div className="space-y-8">
                                                {[{l:'Fijos',k:'pNec',c:'accent-indigo-600',v:vNec},{l:'Variables',k:'pDes',c:'accent-pink-600',v:vDes},{l:'Extra Aho',k:'pAho',c:'accent-emerald-600',v:vAho}].map(i => (
                                                    <div key={i.k} className="space-y-3">
                                                        <div className="flex justify-between text-[11px] font-bold">
                                                            <span className="text-slate-400 uppercase tracking-tighter">{i.l} ({data.config[i.k]}%)</span>
                                                            <span className="text-slate-800">{fmt(i.v)}</span>
                                                        </div>
                                                        <input type="range" min="0" max="100" className="w-full h-1 bg-slate-100 rounded-lg cursor-pointer" value={data.config[i.k]} onChange={e=>updateConfig(i.k,e.target.value)} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-2xl flex flex-col items-center justify-center border border-slate-50">
                                            <div className="h-56 w-full relative">
                                                <div className="absolute inset-0 flex flex-col items-center justify-center z-10 text-center pointer-events-none">
                                                    <span className={`text-2xl font-black tracking-tighter ${disp<0?'text-rose-500':'text-slate-800'}`}>{fmt(disp)}</span>
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase mt-1">Disponible</span>
                                                </div>
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={[{v:gFij + gVar,fill:disp<0?'#fecdd3':'#e0e7ff'}, {v:Math.max(0, disp), fill:'#6366f1'}]} innerRadius={70} outerRadius={85} paddingAngle={0} dataKey="v" stroke="none" startAngle={90} endAngle={450} />
                                                    </PieChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div className={`p-6 rounded-2xl border shadow-sm bg-white ${isNecOver?'border-rose-100 bg-rose-50/20':''}`}>
                                            <div className="flex justify-between items-center mb-8"><h3 className="font-bold text-sm tracking-widest text-slate-400 uppercase">Fijos</h3><button onClick={()=>addGasto(activeTab,'gastosFijos')} className="p-1.5 bg-slate-900 text-white rounded-lg shadow-lg"><Icons.Plus /></button></div>
                                            <div className="space-y-4">
                                                {cur.gastosFijos?.map(g => (
                                                    <div key={g.id} className="flex gap-4 items-center bg-white border border-slate-100 p-2.5 rounded-xl">
                                                        <input className="flex-1 bg-transparent border-none text-xs font-semibold outline-none text-slate-700" value={g.nombre} onChange={e=>updateGasto(activeTab,'gastosFijos',g.id,'nombre',e.target.value)} placeholder="Concepto..." />
                                                        <div className="flex items-center bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100 font-bold text-xs"><span className="text-slate-300 mr-1">€</span><input type="number" className="w-16 bg-transparent outline-none text-right" value={g.valor || ''} onChange={e=>updateGasto(activeTab,'gastosFijos',g.id,'valor',e.target.value)} /></div>
                                                        <button onClick={()=>deleteGasto(activeTab,'gastosFijos',g.id)} className="text-slate-200 hover:text-rose-500"><Icons.Trash /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className={`p-6 rounded-2xl border shadow-sm bg-white ${isDesOver?'border-rose-100 bg-rose-50/20':''}`}>
                                            <div className="flex justify-between items-center mb-8"><h3 className="font-bold text-sm tracking-widest text-slate-400 uppercase">Variables</h3><button onClick={()=>addGasto(activeTab,'gastosVariables')} className="p-1.5 bg-slate-900 text-white rounded-lg shadow-lg"><Icons.Plus /></button></div>
                                            <div className="space-y-6">
                                                {cur.gastosVariables?.map(g => (
                                                    <div key={g.id} className="bg-white border border-slate-100 p-4 rounded-xl shadow-sm space-y-3">
                                                        <div className="flex justify-between items-center">
                                                            <select className="text-[9px] font-bold uppercase text-indigo-600 bg-indigo-50 px-2 py-1 rounded" value={g.tag} onChange={e=>updateGasto(activeTab,'gastosVariables',g.id,'tag',e.target.value)}>{TAGS.map(t=><option key={t}>{t}</option>)}</select>
                                                            <button onClick={()=>deleteGasto(activeTab,'gastosVariables',g.id)} className="text-slate-200 hover:text-rose-500"><Icons.Trash /></button>
                                                        </div>
                                                        <div className="flex gap-4">
                                                            <input className="flex-1 bg-transparent border-none text-sm font-semibold outline-none text-slate-700" value={g.nombre} onChange={e=>updateGasto(activeTab,'gastosVariables',g.id,'nombre',e.target.value)} placeholder="¿En qué?" />
                                                            <div className="flex items-center border-b border-slate-100 font-bold text-sm"><span className="text-slate-300 mr-1">€</span><input type="number" className="w-20 bg-transparent outline-none text-right" value={g.valor || ''} onChange={e=>updateGasto(activeTab,'gastosVariables',g.id,'valor',e.target.value)} /></div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        {isMobileMode && (
                            <nav className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-100 h-24 flex justify-around items-center px-4 pb-8 z-50">
                                <button onClick={() => {setActiveTab('Ahorros'); setShowMonthSelector(false);}} className={`flex flex-col items-center gap-1 flex-1 transition-all ${activeTab==='Ahorros'?'text-indigo-600 scale-110 font-bold font-black':'text-slate-300'}`}><Icons.Wallet /><span className="text-[9px] uppercase font-bold">Vault</span></button>
                                <div className="flex-1 flex justify-center">
                                    <button onClick={() => setShowMonthSelector(!showMonthSelector)} className={`bg-slate-900 text-white p-5 rounded-2xl shadow-xl active:scale-95 transition-all border-4 border-white -translate-y-12 ${showMonthSelector?'bg-indigo-600 rotate-180':''}`}><Icons.Calendar /></button>
                                    {showMonthSelector && (
                                        <div className="absolute bottom-28 left-1/2 -translate-x-1/2 bg-white rounded-[2rem] p-6 shadow-2xl border border-slate-100 grid grid-cols-3 gap-3 w-[280px] animate-in zoom-in">
                                            {MONTHS.map(m => <button key={m} onClick={()=>{setActiveTab(m);setShowMonthSelector(false)}} className={`p-3 text-[10px] font-bold rounded-xl uppercase transition-colors ${activeTab===m?'bg-indigo-600 text-white':'bg-slate-50 text-slate-500'}`}>{m.slice(0,3)}</button>)}
                                        </div>
                                    )}
                                </div>
                                <button onClick={() => {setActiveTab('Préstamos'); setShowMonthSelector(false);}} className={`flex flex-col items-center gap-1.5 flex-1 transition-all ${activeTab==='Préstamos'?'text-indigo-600 scale-110 font-bold font-black':'text-slate-300'}`}><Icons.Loans /><span className="text-[9px] uppercase font-bold">Deudas</span></button>
                            </nav>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
