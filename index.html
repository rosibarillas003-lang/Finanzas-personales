<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<!-- Tailwind + React + Recharts -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body { font-family: Inter, sans-serif; margin:0; background:#f8fafc; }
#loader {
  position:fixed; inset:0; background:#fff;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:9999;
}
.spinner {
  width:40px; height:40px;
  border:3px solid #e5e7eb;
  border-top:3px solid #6366f1;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<body>
<div id="loader">
  <div class="spinner"></div>
  <p style="margin-top:12px;color:#94a3b8;font-size:12px">Iniciando app…</p>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, LabelList } = Recharts;

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const TAGS = ['Comida','Transporte','Compras','Servicios','Ocio'];
const COLORS = ['#6366f1','#ec4899','#0ea5e9','#10b981','#f59e0b'];

const fmt = n => (parseFloat(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const uid = () => Date.now() + Math.random();

function App() {
  const [month, setMonth] = useState(MONTHS[new Date().getMonth()]);
  const [data, setData] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('finance_data')) || {};
    } catch {
      return {};
    }
  });

  useEffect(() => {
    localStorage.setItem('finance_data', JSON.stringify(data));
  }, [data]);

  // Asegurar que cur siempre existe
  const cur = data[month] || { ingresos:0, gastos:[] };

  const updateIngresos = val => {
    setData(d => ({ ...d, [month]: { ...cur, ingresos: +val || 0 } }));
  };

  const addGasto = () => {
    const nuevo = { id: uid(), nombre:'', valor:0, tag:TAGS[0] };
    setData(d => ({ ...d, [month]: { ...cur, gastos:[...(cur.gastos||[]), nuevo] } }));
  };

  const updateGasto = (id, field, val) => {
    const gastos = (cur.gastos||[]).map(g => g.id===id ? { ...g, [field]: field==='valor'?+val||0:val } : g);
    setData(d => ({ ...d, [month]: { ...cur, gastos } }));
  };

  const deleteGasto = id => {
    const gastos = (cur.gastos||[]).filter(g => g.id!==id);
    setData(d => ({ ...d, [month]: { ...cur, gastos } }));
  };

  const totalGastos = (cur.gastos||[]).reduce((s,g)=>s+g.valor,0);
  const disponible = (cur.ingresos||0) - totalGastos;

  const chartData = TAGS.map(t => ({
    name:t,
    value:(cur.gastos||[]).filter(g=>g.tag===t).reduce((s,g)=>s+g.valor,0)
  })).filter(d=>d.value>0);

  return (
    <div className="p-6 max-w-xl mx-auto space-y-6">
      <h1 className="text-2xl font-bold">💰 Finanzas</h1>

      <select value={month} onChange={e=>setMonth(e.target.value)} className="border p-2 rounded w-full">
        {MONTHS.map(m=><option key={m}>{m}</option>)}
      </select>

      <input type="number" placeholder="Ingresos del mes" className="border p-3 rounded w-full"
        value={cur.ingresos||''}
        onChange={e=>updateIngresos(e.target.value)}
      />

      <div className="text-lg font-bold">
        Disponible: <span className={disponible<0?'text-red-500':'text-green-600'}>{fmt(disponible)}</span>
      </div>

      <button onClick={addGasto} className="bg-indigo-600 text-white px-4 py-2 rounded">
        + Agregar gasto
      </button>

      {(cur.gastos||[]).map(g=>(
        <div key={g.id} className="flex gap-2 mt-2">
          <input className="border p-2 flex-1" placeholder="Concepto" value={g.nombre}
            onChange={e=>updateGasto(g.id,'nombre',e.target.value)} />
          <input type="number" className="border p-2 w-24" value={g.valor}
            onChange={e=>updateGasto(g.id,'valor',e.target.value)} />
          <select value={g.tag} onChange={e=>updateGasto(g.id,'tag',e.target.value)}>
            {TAGS.map(t=><option key={t}>{t}</option>)}
          </select>
          <button onClick={()=>deleteGasto(g.id)} className="bg-red-500 text-white px-2 rounded">X</button>
        </div>
      ))}

      {chartData.length>0 && (
        <div className="h-64 mt-6">
          <ResponsiveContainer>
            <BarChart data={chartData} layout="vertical">
              <XAxis type="number" hide />
              <YAxis dataKey="name" type="category" width={80} />
              <Tooltip formatter={fmt}/>
              <Bar dataKey="value">
                {chartData.map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]} />)}
                <LabelList dataKey="value" position="right" formatter={fmt}/>
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}
    </div>
  );
}

// Renderizar React
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Cerrar loader SIEMPRE -->
<script>
window.addEventListener('load', () => {
  const l = document.getElementById('loader');
  if (l) { l.style.opacity = '0'; setTimeout(()=>l.remove(),500); }
});
</script>

</body>
</html>
